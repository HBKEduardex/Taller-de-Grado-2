# gui_axis_move configuration for kuka_gui_control
# Used with the XmlAxisMove bridge mode

kuka_gui_control:
  ros__parameters:

    # ── ROS2 topics ───────────────────────────────────────────────────
    command_topic: "/kuka/axis_move/target_json"
    feedback_topic: "/kuka/axis_move/feedback_json"
    raw_command_xml_topic: "/kuka/axis_move/raw_command_xml"
    raw_feedback_xml_topic: "/kuka/axis_move/raw_robot_xml"

    # ── Publishing behaviour ──────────────────────────────────────────
    auto_publish_hz: 2.0
    step_deg: 1.0

    enable_move_default: false
    require_confirmation_for_first_send: true

    allow_auto_mode: true
    allow_auto_motion: false

    # ── Home / initial position ───────────────────────────────────────
    home_joints_deg:
      A1: 0.0
      A2: -90.0
      A3: 90.0
      A4: 0.0
      A5: 0.0
      A6: 0.0

    # ── Soft limits [min_deg, max_deg] per joint ──────────────────────
    soft_limits_deg:
      A1: [-160.0, 160.0]
      A2: [-180.0, 35.0]
      A3: [-110.0, 146.0]
      A4: [-175.0, 175.0]
      A5: [-110.0, 110.0]
      A6: [-340.0, 340.0]

    # ── Max delta (max degrees per command) ───────────────────────────
    max_delta_deg:
      A1: 2.0
      A2: 2.0
      A3: 2.0
      A4: 2.0
      A5: 2.0
      A6: 2.0

    # ── UI options ────────────────────────────────────────────────────
    feedback_timeout_sec: 2.0
    show_raw_json: true
    show_raw_xml: true

    # ── Secuencias de trayectorias (capa AÑADIDA) ─────────────────────
    # NOTA: gui_axis_move_node.py usa su propio DEFAULT_CONFIG y NO lee
    # este YAML (comportamiento previo, no se ha cambiado). Para mover la
    # carpeta de trayectorias en esta GUI usa la variable de entorno:
    #
    #     export KUKA_TRAJECTORIES_DIR=/ruta/escribible/trajectories
    #
    # Sin ella se resuelve a <raíz del repositorio>/trajectories, que con
    # este checkout es ~/Documents/TG2/trajectories. Nunca install/.
