# gui_control configuration for kuka_gui_control

kuka_gui_control:
  ros__parameters:

    # ── ROS2 topics ───────────────────────────────────────────────────
    command_topic: "/kuka/axis_command/target_json"
    feedback_topic: "/kuka/axis_command_loop/feedback_json"
    raw_feedback_xml_topic: "/kuka/axis_command_loop/raw_robot_xml"

    # ── Publishing behaviour ──────────────────────────────────────────
    auto_publish_hz: 5.0
    step_deg: 1.0
    enable_move_default: true

    # ── Home / initial position ───────────────────────────────────────
    home_joints_deg:
      A1: 0.0
      A2: -90.0
      A3: 90.0
      A4: 0.0
      A5: 0.0
      A6: 0.0

    # ── Soft limits [min_deg, max_deg] per joint ──────────────────────
    soft_limits_deg:
      A1: [-160.0, 160.0]
      A2: [-180.0, 35.0]
      A3: [-110.0, 146.0]
      A4: [-175.0, 175.0]
      A5: [-110.0, 110.0]
      A6: [-340.0, 340.0]

    # ── UI options ────────────────────────────────────────────────────
    require_confirmation_for_first_send: true
    show_raw_json: true
    feedback_timeout_sec: 2.0
