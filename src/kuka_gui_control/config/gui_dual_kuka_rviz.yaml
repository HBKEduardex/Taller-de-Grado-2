# gui_dual_kuka_rviz configuration for kuka_gui_control
# Dual mode: KUKA Real TCP/IP + RViz/MoveIt2

kuka_gui_dual_node:
  ros__parameters:

    # ── KUKA TCP/IP topics ────────────────────────────────────────────
    kuka_target_topic: "/kuka/axis_move/target_json"
    kuka_feedback_topic: "/kuka/axis_move/feedback_json"
    kuka_raw_command_xml_topic: "/kuka/axis_move/raw_command_xml"
    kuka_raw_robot_xml_topic: "/kuka/axis_move/raw_robot_xml"

    # ── RViz / MoveIt2 topics ─────────────────────────────────────────
    rviz_joint_command_topic: "/kuka_bridge/joint_command_deg"
    rviz_cartesian_command_topic: "/kuka_bridge/cartesian_command_deg"
    rviz_status_topic: "/kuka_bridge/status"
    rviz_joint_state_topic: "/kuka_bridge/joint_state_deg"
    rviz_cartesian_state_topic: "/kuka_bridge/cartesian_state_deg"

    # ── Publishing behaviour ──────────────────────────────────────────
    step_deg: 1.0
    auto_publish_hz: 2.0

    enable_move_default: false
    require_confirmation_for_first_send: true

    allow_auto_mode: true
    allow_auto_motion: false

    publish_joints_to_kuka: true
    publish_joints_to_rviz: true

    publish_cartesian_to_kuka: true
    publish_cartesian_to_rviz: true

    # ── Home articular [0, -90, 90, 0, 90, 0] deg ─────────────────────
    home_joints_deg:
      A1: 0.0
      A2: -90.0
      A3: 90.0
      A4: 0.0
      A5: 90.0
      A6: 0.0

    # ── Home cartesiano [445, 0, 810] mm, [180, 0, 180] deg ───────────
    # X, Y, Z en MILÍMETROS (la GUI convierte a metros al publicar a MoveIt2).
    home_cartesian:
      X: 445.0
      Y: 0.0
      Z: 810.0
      A: 180.0
      B: 0.0
      C: 180.0

    # ── Soft limits [min_deg, max_deg] per joint ──────────────────────
    soft_limits_deg:
      A1: [-160.0, 160.0]
      A2: [-180.0, 35.0]
      A3: [-110.0, 146.0]
      A4: [-175.0, 175.0]
      A5: [-110.0, 110.0]
      A6: [-340.0, 340.0]

    # ── UI options ────────────────────────────────────────────────────
    feedback_timeout_sec: 2.0
    show_raw_json: true
    show_raw_xml: true

    # ── Secuencias de trayectorias (capa AÑADIDA) ─────────────────────
    # Carpeta donde la GUI guarda los .json generados por MoveIt2.
    # Vacío = resolución automática a <raíz del repositorio>/trajectories,
    # que con este checkout es:
    #     ~/Documents/TG2/trajectories
    # Nunca se escribe dentro de install/. Se puede forzar también con la
    # variable de entorno KUKA_TRAJECTORIES_DIR.
    trajectories_dir: ""

    # Espera máxima de la respuesta de MoveIt2 tras pulsar ENVIAR PUNTOS.
    trajectory_generation_timeout_sec: 60.0

    # ── Ejecución física de un archivo (ENVIAR TRAYECTORIA) ───────────
    # Salto máximo admitido entre puntos consecutivos (y desde la posición
    # real al primer punto). Es independiente del límite de SEND manual.
    trajectory_max_delta_deg: 10.0

    # Tolerancia de llegada por articulación antes de pasar al siguiente
    # punto intermedio.
    trajectory_arrival_tolerance_deg: 0.5

    # Reenvío del mismo objetivo mientras no se confirma la llegada. Debe
    # quedar por debajo de command_timeout_sec del bridge (2.0 s), igual
    # que el "hold" que ya usa el botón SEND.
    trajectory_resend_period_sec: 0.5

    # Tiempo máximo para alcanzar UN punto intermedio antes de abortar.
    trajectory_point_timeout_sec: 15.0

    # Suelo de tiempo entre puntos consecutivos. Protege la memoria de
    # recepción de EthernetKRL, que cierra la conexión a los 16 elementos
    # sin leer (el guard del bridge ya corta en 10).
    trajectory_min_point_period_sec: 0.2

    # Espera tras ordenar una acción de garra. El protocolo actual no
    # publica estado de garra, así que se respeta un tiempo de asentamiento
    # en lugar de inventar una confirmación que no existe.
    trajectory_gripper_settle_sec: 2.0
